version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # setuptools_scm derives the version from the git tags, which a shallow clone doesn't have
    post_checkout:
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats: []
