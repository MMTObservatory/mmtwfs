# GitHub Actions workflow for mmtwfs testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: CI Tests

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:

# Use the OpenAstronomy re-usable workflow that handles the dirty work of setting up
# workers and running tox.
jobs:
  test:
    # Codecov authenticates through GitHub OIDC (coverage: codecov-oidc), so no upload token is stored.
    # That also covers Dependabot PRs, which can't read the repository's Actions secrets.
    permissions:
      contents: read
      id-token: write
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@v3.2.2
    with:
      envs: |
        - linux: codestyle
          pytest: false
        - linux: py313-alldeps
          name: py313
        # coverage comes from this job only; the code has no version-specific paths
        - linux: py314-alldeps-cov
          name: py314
          coverage: 'codecov-oidc'
        - linux: py314-devdeps
          name: py314-devdeps
        - linux: py315-devdeps
          name: py315-devdeps
        - linux: build_docs
          pytest: false
      # codestyle and build_docs have no python version in their env names. The
      # runner default is older than this package supports, so pin it.
      default_python: '3.14'
