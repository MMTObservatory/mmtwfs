# GitHub Actions workflow for mmtwfs testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: CI Tests

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:

# Use the OpenAstronomy re-usable workflow that handles the dirty work of setting up
# workers and running tox.
jobs:
  test:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@v3
    with:
      envs: |
        - linux: codestyle
          pytest: false
        - linux: py313-alldeps
          name: py313
        - linux: py313-devdeps
          name: py313-devdeps
        # coverage comes from this job only; the code has no version-specific paths
        - linux: py314-alldeps-cov
          name: py314
        - linux: py314-devdeps
          name: py314-devdeps
        # 3.15 is still a prerelease; -dev lets setup-python install it
        - linux: py315-devdeps
          name: py315-devdeps
          python-version: '3.15-dev'
        - linux: build_docs
          pytest: false
      coverage: 'codecov'
      # codestyle and build_docs have no python version in their env names. The
      # runner default is older than this package supports, so pin it.
      default_python: '3.13'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV }}
